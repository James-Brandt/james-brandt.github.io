
<!-- =========================================================
     1. DYNAMIC FAVICON
     Changes favicon depending on whether the tab is active.
========================================================= -->

<link
  rel="icon"
  id="dynamic-favicon"
  href="{{ '/assets/images/favicon-inactive.ico' | relative_url }}"
  type="image/x-icon"
/>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const favicon = document.getElementById("dynamic-favicon");
    if (!favicon) return;

    const activeIcon = "{{ '/assets/images/favicon-active.ico' | relative_url }}";
    const inactiveIcon = "{{ '/assets/images/favicon-inactive.ico' | relative_url }}";

    function updateFavicon() {
      favicon.href = document.hidden || !document.hasFocus()
        ? inactiveIcon
        : activeIcon;
    }

    document.addEventListener("visibilitychange", updateFavicon);
    window.addEventListener("focus", updateFavicon);
    window.addEventListener("blur", updateFavicon);

    updateFavicon();
  });
</script>

<!-- =========================================================
     3. MATHJAX
     Enables LaTeX equations in project posts.
========================================================= -->

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    options: {
      renderActions: {
        addMenu: []
      }
    }
  };
</script>

<script
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>


<!-- =========================================================
     4. CUSTOM WEBSITE STYLING
========================================================= -->

<style>

     4.1 GLOBAL LAYOUT

  }

      padding-right: 0 !important;
